# Panda Pocket local deployment
#
# Day 1 scope: data stores and logging only. Application services are added to
# this file as they are built (Rate on day 2, Invoice and Gateway on day 3,
# Merchant on day 4, Settlement on day 5).

name: pandapocket

services:

  # ---------------------------------------------------------------------------
  # Postgres: hosts merchant_db, invoice_db and settlement_db, one login role
  # each. See infra/postgres/init.sql.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_root_dev
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pandapocket]

  # ---------------------------------------------------------------------------
  # MongoDB: rate tick history. Chosen over Postgres for this one workload
  # because ticks are append-only, schema-light and read by time range, which is
  # what makes the persistence polyglot rather than decorative.
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: pp-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: rate_svc
      MONGO_INITDB_ROOT_PASSWORD: rate_pw_dev
      MONGO_INITDB_DATABASE: rate_db
    # Published on 27018, not 27017. This machine runs a local MongoDB service
    # of its own, and two servers competing for 27017 means a host process
    # silently reaches whichever bound first. Publishing elsewhere leaves the
    # local install alone and removes the ambiguity. Nothing inside the compose
    # network is affected: services reach this container as mongo:27017.
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pandapocket]

  # ---------------------------------------------------------------------------
  # Seq: centralised structured logging. Every service ships Serilog events here
  # stamped with X-Correlation-Id, which is what makes one payment traceable
  # across four services.
  #
  # Inside the container Seq serves the UI and management API on port 80, and
  # accepts log ingestion on 5341. Publishing 5341:80 therefore puts the UI on
  # the conventional Seq port on the host. Services on the compose network ship
  # their logs to http://seq directly and never use the published port.
  #
  # Two environment variables are mandatory or the container exits on start:
  #   ACCEPT_EULA                  - licence acceptance
  #   SEQ_FIRSTRUN_NOAUTHENTICATION - current Seq refuses to initialise unless
  #     an admin password is supplied or authentication is explicitly declined.
  #     This is a local demo log sink on a private compose network holding no
  #     production data, and a login wall in front of the logging evidence would
  #     only get in the way of the demo. A deployed instance would set
  #     SEQ_FIRSTRUN_ADMINPASSWORD instead.
  # ---------------------------------------------------------------------------
  seq:
    image: datalust/seq:latest
    container_name: pp-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seqdata:/data
    networks: [pandapocket]

  # ---------------------------------------------------------------------------
  # Rate: ZAR conversion quotes and tick history.
  #
  # Reached by other services as http://rate-service:8080. That name is resolved
  # by Docker's embedded DNS on the compose network, which is this system's
  # service discovery mechanism: Ocelot routes to the service name, never to a
  # container IP, so containers can be replaced without reconfiguring anything.
  #
  # The build context is the repository root because this project references
  # src/Shared/Contracts. See the comment at the top of its Dockerfile.
  # ---------------------------------------------------------------------------
  rate-service:
    build:
      context: .
      dockerfile: src/Services/Rate.Api/Dockerfile
    container_name: pp-rate
    environment:
      ServiceRegistry__Enabled: "true"
      ServiceRegistry__ConsulUrl: http://consul:8500
      ServiceRegistry__ServiceName: rate-service
      # The address other services use to reach this instance.
      ServiceRegistry__ServiceAddress: rate-service
      ServiceRegistry__ServicePort: 8080
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      # Inside the network this is the container port 27017, not the published
      # 27018. Compose DNS resolves "mongo" to the container.
      Mongo__ConnectionString: mongodb://rate_svc:rate_pw_dev@mongo:27017/?authSource=admin
      Seq__ServerUrl: http://seq:5341
      Soc__Enabled: "true"
      Soc__IngestBaseUrl: http://soc-service:8080
      Soc__ServiceName: rate-service
    ports:
      - "5003:8080"
    depends_on:
      consul:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [pandapocket]

  # ---------------------------------------------------------------------------
  # Consul: the service registry.
  #
  # Each service registers itself here on startup with a health check pointing
  # back at its own /health endpoint, and deregisters on shutdown. Consul polls
  # those checks, so the catalogue reflects which instances can actually serve a
  # request rather than merely which containers exist.
  #
  # The UI at http://localhost:8500 lists every registered service, its address,
  # its port and its health.
  # ---------------------------------------------------------------------------
  consul:
    image: hashicorp/consul:1.20
    container_name: pp-consul
    # server_rejoin_age_max is raised from its seven-day default.
    #
    # Consul refuses to rejoin a cluster it has been absent from for longer than
    # that, because in production a server returning after a week carries stale
    # Raft state that could disrupt a healthy one. Here there is a single server,
    # no cluster to disrupt, and leaving the project alone for three weeks is
    # ordinary, so the check turns "start the stack" into "wipe the data dir
    # first" and buys nothing.
    #
    # Wiping it is in fact harmless: the registry holds no durable state and
    # every service re-registers itself on startup. That is precisely what
    # self-registration buys, and it is why there is no volume here.
    command: >
      agent -server -bootstrap-expect=1 -ui
      -client=0.0.0.0 -bind=0.0.0.0
      -data-dir=/consul/data
    environment:
      # Passed as JSON rather than as an -hcl flag: the folded block above
      # strips the quotes HCL needs, which produced "failed to parse flags-0.hcl"
      # rather than anything resembling the real problem.
      CONSUL_LOCAL_CONFIG: '{"server_rejoin_age_max": "8760h"}'
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [pandapocket]

  # ---------------------------------------------------------------------------
  # Merchant: accounts, hashed API keys and dashboard authentication.
  #
  # Its /api/internal/keys/validate endpoint is not routed through Ocelot, so it
  # is reachable only from inside this network. A publicly exposed key-validation
  # endpoint would be an oracle letting anyone test guessed keys at will.
  # ---------------------------------------------------------------------------
  merchant-service:
    build:
      context: .
      dockerfile: src/Services/Merchant.Api/Dockerfile
    container_name: pp-merchant
    environment:
      ServiceRegistry__Enabled: "true"
      ServiceRegistry__ConsulUrl: http://consul:8500
      ServiceRegistry__ServiceName: merchant-service
      # The address other services use to reach this instance.
      ServiceRegistry__ServiceAddress: merchant-service
      ServiceRegistry__ServicePort: 8080
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__MerchantDb: "Host=postgres;Port=5432;Database=merchant_db;Username=merchant_svc;Password=merchant_pw_dev"
      Seq__ServerUrl: http://seq:5341
      Soc__Enabled: "true"
      Soc__IngestBaseUrl: http://soc-service:8080
      Soc__ServiceName: merchant-service
      # A committed signing key is exactly as good as no authentication, because
      # anyone holding it can mint a token for any merchant. It is overridden
      # here to make the point that it belongs in the environment, and in a real
      # deployment this value would come from a secret store rather than a file.
      Jwt__SigningKey: "panda-pocket-compose-signing-key-still-not-a-secret"
    ports:
      - "5001:8080"
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [pandapocket]

  # ---------------------------------------------------------------------------
  # Settlement: the merchant ZAR ledger, platform fee income and webhook
  # delivery with retry.
  #
  # The webhook dispatcher runs here as a background worker rather than as a
  # separate container, because it shares the deliveries table and there is no
  # need to scale it independently at this size.
  # ---------------------------------------------------------------------------
  settlement-service:
    build:
      context: .
      dockerfile: src/Services/Settlement.Api/Dockerfile
    container_name: pp-settlement
    environment:
      ServiceRegistry__Enabled: "true"
      ServiceRegistry__ConsulUrl: http://consul:8500
      ServiceRegistry__ServiceName: settlement-service
      # The address other services use to reach this instance.
      ServiceRegistry__ServiceAddress: settlement-service
      ServiceRegistry__ServicePort: 8080
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__SettlementDb: "Host=postgres;Port=5432;Database=settlement_db;Username=settlement_svc;Password=settlement_pw_dev"
      Services__MerchantBaseUrl: http://merchant-service:8080
      Seq__ServerUrl: http://seq:5341
      Soc__Enabled: "true"
      Soc__IngestBaseUrl: http://soc-service:8080
      Soc__ServiceName: settlement-service
    ports:
      - "5004:8080"
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [pandapocket]

  # ---------------------------------------------------------------------------
  # Invoice: the payment lifecycle and the state machine.
  #
  # Applies its own EF Core migrations at startup, so a clean clone plus
  # "docker compose up" produces a working schema with no manual step.
  # ---------------------------------------------------------------------------
  invoice-service:
    build:
      context: .
      dockerfile: src/Services/Invoice.Api/Dockerfile
    container_name: pp-invoice
    environment:
      ServiceRegistry__Enabled: "true"
      ServiceRegistry__ConsulUrl: http://consul:8500
      ServiceRegistry__ServiceName: invoice-service
      # The address other services use to reach this instance.
      ServiceRegistry__ServiceAddress: invoice-service
      ServiceRegistry__ServicePort: 8080
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__InvoiceDb: "Host=postgres;Port=5432;Database=invoice_db;Username=invoice_svc;Password=invoice_pw_dev"
      # Reached by compose DNS on the service name, never an IP.
      Invoice__RateServiceBaseUrl: http://rate-service:8080
      Invoice__SettlementServiceBaseUrl: http://settlement-service:8080
      Seq__ServerUrl: http://seq:5341
      Soc__Enabled: "true"
      Soc__IngestBaseUrl: http://soc-service:8080
      Soc__ServiceName: invoice-service
    ports:
      - "5002:8080"
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rate-service:
        condition: service_healthy
      settlement-service:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [pandapocket]

  # ---------------------------------------------------------------------------
  # SOC: security and operational event collection.
  #
  # Phase 2. Every other service publishes its security events here in batches
  # over HTTP; this service owns soc_db and nothing else writes to it, so the
  # database-per-service rule holds rather than being quietly broken by five
  # services sharing one telemetry schema.
  #
  # Nothing depends_on this. The publisher in each service drops events rather
  # than blocking when the collector is unreachable, so making payments wait for
  # telemetry to start would trade a real capability for a cosmetic one. It also
  # polls Consul for health transitions, which is the one event source no
  # service can report about itself.
  # ---------------------------------------------------------------------------
  soc-service:
    build:
      context: .
      dockerfile: src/Services/Soc.Api/Dockerfile
    container_name: pp-soc
    environment:
      ServiceRegistry__Enabled: "true"
      ServiceRegistry__ConsulUrl: http://consul:8500
      ServiceRegistry__ServiceName: soc-service
      ServiceRegistry__ServiceAddress: soc-service
      ServiceRegistry__ServicePort: 8080
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__SocDb: "Host=postgres;Port=5432;Database=soc_db;Username=soc_svc;Password=soc_pw_dev"
      Soc__HealthPollEnabled: "true"
      Soc__HealthPollSeconds: 10
      Seq__ServerUrl: http://seq:5341
    ports:
      - "5005:8080"
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [pandapocket]

  # ---------------------------------------------------------------------------
  # Gateway: the single public entry point.
  #
  # Routes by path to the services above, using compose service names that
  # Docker's embedded DNS resolves. Also serves the browser client, which is why
  # the client's fetch calls are same-origin and need no CORS.
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    container_name: pp-gateway
    environment:
      ServiceRegistry__Enabled: "true"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Seq__ServerUrl: http://seq:5341
      Soc__Enabled: "true"
      Soc__IngestBaseUrl: http://soc-service:8080
      Soc__ServiceName: gateway
      # Used by the API key middleware. A compose service name, like every other
      # service-to-service call in the system.
      Services__MerchantBaseUrl: http://merchant-service:8080
    ports:
      - "5000:8080"
    depends_on:
      consul:
        condition: service_healthy
      invoice-service:
        condition: service_healthy
      rate-service:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [pandapocket]

volumes:
  pgdata:
  mongodata:
  seqdata:

networks:
  pandapocket:
    driver: bridge
    name: pandapocket-net
