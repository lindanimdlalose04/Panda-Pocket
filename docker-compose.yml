# Panda Pocket local deployment
#
# Day 1 scope: data stores and logging only. Application services are added to
# this file as they are built (Rate on day 2, Invoice and Gateway on day 3,
# Merchant on day 4, Settlement on day 5).

name: pandapocket

services:

  # ---------------------------------------------------------------------------
  # Postgres: hosts merchant_db, invoice_db and settlement_db, one login role
  # each. See infra/postgres/init.sql.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_root_dev
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pandapocket]

  # ---------------------------------------------------------------------------
  # MongoDB: rate tick history. Chosen over Postgres for this one workload
  # because ticks are append-only, schema-light and read by time range, which is
  # what makes the persistence polyglot rather than decorative.
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: pp-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: rate_svc
      MONGO_INITDB_ROOT_PASSWORD: rate_pw_dev
      MONGO_INITDB_DATABASE: rate_db
    # Published on 27018, not 27017. This machine runs a local MongoDB service
    # of its own, and two servers competing for 27017 means a host process
    # silently reaches whichever bound first. Publishing elsewhere leaves the
    # local install alone and removes the ambiguity. Nothing inside the compose
    # network is affected: services reach this container as mongo:27017.
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pandapocket]

  # ---------------------------------------------------------------------------
  # Seq: centralised structured logging. Every service ships Serilog events here
  # stamped with X-Correlation-Id, which is what makes one payment traceable
  # across four services.
  #
  # Inside the container Seq serves the UI and management API on port 80, and
  # accepts log ingestion on 5341. Publishing 5341:80 therefore puts the UI on
  # the conventional Seq port on the host. Services on the compose network ship
  # their logs to http://seq directly and never use the published port.
  #
  # Two environment variables are mandatory or the container exits on start:
  #   ACCEPT_EULA                  - licence acceptance
  #   SEQ_FIRSTRUN_NOAUTHENTICATION - current Seq refuses to initialise unless
  #     an admin password is supplied or authentication is explicitly declined.
  #     This is a local demo log sink on a private compose network holding no
  #     production data, and a login wall in front of the logging evidence would
  #     only get in the way of the demo. A deployed instance would set
  #     SEQ_FIRSTRUN_ADMINPASSWORD instead.
  # ---------------------------------------------------------------------------
  seq:
    image: datalust/seq:latest
    container_name: pp-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seqdata:/data
    networks: [pandapocket]

  # ---------------------------------------------------------------------------
  # Rate: ZAR conversion quotes and tick history.
  #
  # Reached by other services as http://rate-service:8080. That name is resolved
  # by Docker's embedded DNS on the compose network, which is this system's
  # service discovery mechanism: Ocelot routes to the service name, never to a
  # container IP, so containers can be replaced without reconfiguring anything.
  #
  # The build context is the repository root because this project references
  # src/Shared/Contracts. See the comment at the top of its Dockerfile.
  # ---------------------------------------------------------------------------
  rate-service:
    build:
      context: .
      dockerfile: src/Services/Rate.Api/Dockerfile
    container_name: pp-rate
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      # Inside the network this is the container port 27017, not the published
      # 27018. Compose DNS resolves "mongo" to the container.
      Mongo__ConnectionString: mongodb://rate_svc:rate_pw_dev@mongo:27017/?authSource=admin
      Seq__ServerUrl: http://seq:5341
    ports:
      - "5003:8080"
    depends_on:
      mongo:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [pandapocket]

  # ---------------------------------------------------------------------------
  # Invoice: the payment lifecycle and the state machine.
  #
  # Applies its own EF Core migrations at startup, so a clean clone plus
  # "docker compose up" produces a working schema with no manual step.
  # ---------------------------------------------------------------------------
  invoice-service:
    build:
      context: .
      dockerfile: src/Services/Invoice.Api/Dockerfile
    container_name: pp-invoice
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__InvoiceDb: "Host=postgres;Port=5432;Database=invoice_db;Username=invoice_svc;Password=invoice_pw_dev"
      # Reached by compose DNS on the service name, never an IP.
      Invoice__RateServiceBaseUrl: http://rate-service:8080
      Seq__ServerUrl: http://seq:5341
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rate-service:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [pandapocket]

  # ---------------------------------------------------------------------------
  # Gateway: the single public entry point.
  #
  # Routes by path to the services above, using compose service names that
  # Docker's embedded DNS resolves. Also serves the browser client, which is why
  # the client's fetch calls are same-origin and need no CORS.
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    container_name: pp-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Seq__ServerUrl: http://seq:5341
    ports:
      - "5000:8080"
    depends_on:
      invoice-service:
        condition: service_healthy
      rate-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [pandapocket]

volumes:
  pgdata:
  mongodata:
  seqdata:

networks:
  pandapocket:
    driver: bridge
    name: pandapocket-net
